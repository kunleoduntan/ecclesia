[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecclesia"
authors = [
    { name = "Kunle Oduntan", email = "kunleoduntan@gmail.com.com" }
]
description = "Ecclesia app for Frappe/ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pypika",
    "twilio>=8.0.0",
    "vonage",
    "plivo",
    "requests>=2.28.0",
]

[tool.setuptools]
packages = ["ecclesia"]
