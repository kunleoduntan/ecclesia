<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Payment Matcher</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0d0f14;
    --surface:   #151820;
    --card:      #1c2030;
    --border:    #252a3a;
    --accent:    #6c63ff;
    --accent2:   #00d4aa;
    --danger:    #ff4f6b;
    --warn:      #ffb547;
    --text:      #e8eaf0;
    --muted:     #6b7280;
    --approved:  #00d4aa;
    --rejected:  #ff4f6b;
    --pending:   #ffb547;
    --mono:      'DM Mono', monospace;
    --sans:      'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Background grid ── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(108,99,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(108,99,255,.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .app {
    position: relative; z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 28px;
    gap: 16px;
  }
  .header-left h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #a78bfa, #6c63ff, #00d4aa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-left .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    font-family: var(--mono);
  }
  .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all .18s ease;
    white-space: nowrap;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, #6c63ff, #9d6cff);
    color: #fff;
    box-shadow: 0 4px 15px rgba(108,99,255,.35);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,99,255,.45); }
  .btn-success {
    background: linear-gradient(135deg, #00d4aa, #00b894);
    color: #0d1a16;
    box-shadow: 0 4px 15px rgba(0,212,170,.3);
  }
  .btn-success:hover:not(:disabled) { transform: translateY(-1px); }
  .btn-danger {
    background: linear-gradient(135deg, #ff4f6b, #e84393);
    color: #fff;
  }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--card); color: var(--text); }

  /* ── Stats strip ── */
  .stats-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    transition: border-color .2s;
  }
  .stat-card:hover { border-color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-family: var(--mono); }
  .stat-value { font-size: 28px; font-weight: 700; margin-top: 6px; font-family: var(--mono); }
  .stat-value.green { color: var(--approved); }
  .stat-value.red   { color: var(--rejected); }
  .stat-value.gold  { color: var(--warn); }
  .stat-value.purple { color: var(--accent); }

  /* ── Filters bar ── */
  .filters-bar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .filter-pill {
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    transition: all .15s;
    font-family: var(--mono);
  }
  .filter-pill.active-all    { background: var(--accent);   color: #fff; border-color: var(--accent); }
  .filter-pill.active-pend   { background: var(--warn);     color: #1a1200; border-color: var(--warn); }
  .filter-pill.active-appr   { background: var(--approved); color: #001a14; border-color: var(--approved); }
  .filter-pill.active-rej    { background: var(--rejected); color: #fff; border-color: var(--rejected); }
  .filter-pill.active-done   { background: #2d3748; color: var(--text); border-color: #4a5568; }

  .search-input {
    margin-left: auto;
    padding: 7px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    width: 220px;
    outline: none;
    transition: border-color .2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  /* ── Match cards ── */
  .matches-list { display: flex; flex-direction: column; gap: 12px; }

  .match-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0;
    overflow: hidden;
    transition: all .2s ease;
    animation: slideIn .3s ease both;
  }
  .match-card:hover { border-color: #3a4060; box-shadow: 0 4px 24px rgba(0,0,0,.3); }
  .match-card.approved { border-left: 3px solid var(--approved); }
  .match-card.rejected { border-left: 3px solid var(--rejected); opacity: .7; }
  .match-card.pending  { border-left: 3px solid var(--warn); }
  .match-card.applied  { border-left: 3px solid #4a5568; opacity: .65; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
  }

  .side-block { min-width: 0; }
  .side-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); font-family: var(--mono); margin-bottom: 4px;
  }
  .side-name {
    font-size: 14px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .side-party {
    font-size: 12px; color: var(--muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: var(--mono);
  }
  .side-amount {
    font-size: 18px; font-weight: 700; font-family: var(--mono);
    margin-top: 4px;
  }
  .payment-amount  { color: var(--accent2); }
  .invoice-amount  { color: var(--accent); }

  /* Confidence gauge in center */
  .confidence-center {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; flex-shrink: 0; width: 90px;
  }
  .conf-ring {
    position: relative; width: 68px; height: 68px;
  }
  .conf-ring svg { transform: rotate(-90deg); }
  .conf-ring .track { fill: none; stroke: var(--border); stroke-width: 5; }
  .conf-ring .fill  { fill: none; stroke-width: 5; stroke-linecap: round;
                      transition: stroke-dashoffset .6s ease, stroke .3s; }
  .conf-number {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 15px; font-weight: 700;
  }
  .conf-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); font-family: var(--mono);
  }

  /* Arrow connector */
  .arrow-connector { flex-shrink: 0; color: var(--muted); font-size: 20px; }

  /* ── AI reasoning strip ── */
  .reasoning-strip {
    background: rgba(108,99,255,.07);
    border-top: 1px solid rgba(108,99,255,.12);
    padding: 10px 20px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .ai-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  .reasoning-text { font-size: 12px; color: #9ba3bc; font-style: italic; line-height: 1.5; }

  /* ── Action footer ── */
  .card-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,.15);
    gap: 12px; flex-wrap: wrap;
  }
  .footer-left { display: flex; align-items: center; gap: 10px; }
  .amount-edit {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
  }
  .amount-input {
    width: 110px; padding: 5px 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-family: var(--mono);
    font-size: 12px; outline: none;
  }
  .amount-input:focus { border-color: var(--accent); }
  .status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600; font-family: var(--mono);
  }
  .badge-pending  { background: rgba(255,181,71,.15);  color: var(--warn); }
  .badge-approved { background: rgba(0,212,170,.15);   color: var(--approved); }
  .badge-rejected { background: rgba(255,79,107,.15);  color: var(--rejected); }
  .badge-applied  { background: rgba(74,85,104,.2);    color: #718096; }
  .footer-right { display: flex; gap: 8px; }

  /* ── Empty state ── */
  .empty-state {
    text-align: center; padding: 80px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 52px; margin-bottom: 16px; }
  .empty-title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .empty-sub { font-size: 14px; }

  /* ── Toast ── */
  .toast-container {
    position: fixed; bottom: 24px; right: 24px; z-index: 9999;
    display: flex; flex-direction: column; gap: 8px;
  }
  .toast {
    padding: 12px 18px; border-radius: 10px; font-size: 13px;
    font-weight: 500; max-width: 340px;
    animation: toastIn .3s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .toast.success { background: #0a2e26; border: 1px solid var(--approved); color: var(--approved); }
  .toast.error   { background: #2e0a12; border: 1px solid var(--rejected); color: var(--rejected); }
  .toast.info    { background: #1a1a3e; border: 1px solid var(--accent);   color: #a78bfa; }
  @keyframes toastIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:none; } }

  /* ── Loading spinner ── */
  .spinner-overlay {
    position: fixed; inset: 0; z-index: 9998;
    background: rgba(13,15,20,.8);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner-text { color: var(--muted); font-size: 14px; font-family: var(--mono); }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .card-header { grid-template-columns: 1fr; gap: 12px; }
    .confidence-center { flex-direction: row; width: auto; }
    .header { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <h1>🤖 AI Payment Matcher</h1>
      <div class="subtitle" id="doc-subtitle">Loading...</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" onclick="window.history.back()">← Back</button>
      <button class="btn btn-success" id="btn-apply-all" onclick="applyAllApproved()" disabled>
        ✓ Apply All Approved
      </button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-strip" id="stats-strip">
    <div class="stat-card">
      <div class="stat-label">Proposed</div>
      <div class="stat-value purple" id="stat-proposed">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Pending Review</div>
      <div class="stat-value gold" id="stat-pending">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Approved</div>
      <div class="stat-value green" id="stat-approved">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Rejected</div>
      <div class="stat-value red" id="stat-rejected">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Applied</div>
      <div class="stat-value" id="stat-applied" style="color:#718096">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Reconciled</div>
      <div class="stat-value green" id="stat-reconciled" style="font-size:18px">—</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters-bar">
    <span class="filter-pill active-all" data-filter="all"    onclick="setFilter('all',this)">All</span>
    <span class="filter-pill"           data-filter="Pending" onclick="setFilter('Pending',this)">Pending</span>
    <span class="filter-pill"           data-filter="Approved"onclick="setFilter('Approved',this)">Approved</span>
    <span class="filter-pill"           data-filter="Rejected"onclick="setFilter('Rejected',this)">Rejected</span>
    <span class="filter-pill"           data-filter="applied" onclick="setFilter('applied',this)">Applied</span>
    <input class="search-input" type="text" placeholder="Search party, invoice, payment..."
           oninput="filterCards()" id="search-box">
  </div>

  <!-- Match list -->
  <div class="matches-list" id="matches-list">
    <div class="empty-state">
      <div class="spinner" style="margin:0 auto 16px"></div>
      <div class="empty-title">Loading matches...</div>
    </div>
  </div>

</div>

<!-- Toast container -->
<div class="toast-container" id="toasts"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const APP = "ecclesia";
const API = `/${APP}/api/method/ecclesia.payment_invoice_match.payment_invoice_match`;

// Get doc name from URL (Frappe route or query param)
function getDocName() {
  const parts = window.location.pathname.split("/");
  const idx   = parts.indexOf("payment-match-review");
  if (idx !== -1 && parts[idx+1]) return decodeURIComponent(parts[idx+1]);
  const params = new URLSearchParams(window.location.search);
  return params.get("name") || params.get("doc");
}

const DOC_NAME = getDocName();
let allLines   = [];
let activeFilter = "all";

// ── Bootstrap ──────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  if (!DOC_NAME) {
    renderEmpty("No document name found in URL.");
    return;
  }
  loadData();
});

// ── Load data ────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const res = await apiFetch(`${API}.get_match_data`, { doc_name: DOC_NAME });
    const d   = res.message;
    if (!d) { renderEmpty("No data returned."); return; }

    allLines = d.lines || [];

    // Subtitle
    document.getElementById("doc-subtitle").textContent =
      `${DOC_NAME}  ·  ${d.company}  ·  ${d.party_type}  ·  Status: ${d.status}`;

    updateStats();
    renderCards();

  } catch(e) {
    renderEmpty(`Error: ${e.message}`);
  }
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function updateStats() {
  const proposed  = allLines.length;
  const pending   = allLines.filter(l => l.match_status === "Pending" && !l.applied).length;
  const approved  = allLines.filter(l => l.match_status === "Approved" && !l.applied).length;
  const rejected  = allLines.filter(l => l.match_status === "Rejected").length;
  const applied   = allLines.filter(l => l.applied).length;
  const reconciled= allLines.filter(l => l.applied).reduce((s,l) => s+l.allocated_amount, 0);

  document.getElementById("stat-proposed").textContent  = proposed;
  document.getElementById("stat-pending").textContent   = pending;
  document.getElementById("stat-approved").textContent  = approved;
  document.getElementById("stat-rejected").textContent  = rejected;
  document.getElementById("stat-applied").textContent   = applied;
  document.getElementById("stat-reconciled").textContent= fmt(reconciled);

  document.getElementById("btn-apply-all").disabled = approved === 0;
}

// ── Filter ────────────────────────────────────────────────────────────────────
function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll(".filter-pill").forEach(p => {
    p.className = "filter-pill";
    if (p.dataset.filter === f) {
      p.classList.add(
        f==="all"?"active-all":f==="Pending"?"active-pend":
        f==="Approved"?"active-appr":f==="Rejected"?"active-rej":"active-done"
      );
    }
  });
  renderCards();
}

function filterCards() { renderCards(); }

function visibleLines() {
  const q = (document.getElementById("search-box").value || "").toLowerCase();
  return allLines.filter(l => {
    if (activeFilter === "applied"  && !l.applied) return false;
    if (activeFilter === "Pending"  && (l.match_status !== "Pending"  || l.applied)) return false;
    if (activeFilter === "Approved" && (l.match_status !== "Approved" || l.applied)) return false;
    if (activeFilter === "Rejected" && l.match_status !== "Rejected") return false;
    if (q) {
      const hay = [l.payment_entry,l.invoice,l.payment_party,l.ai_reasoning].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderCards() {
  const lines = visibleLines();
  const list  = document.getElementById("matches-list");

  if (!lines.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">No matches here</div>
      <div class="empty-sub">Try a different filter or search term.</div>
    </div>`;
    return;
  }

  list.innerHTML = lines.map((l, i) => cardHTML(l, i)).join("");
}

function cardHTML(l, animIdx) {
  const statusClass = l.applied ? "applied" : l.match_status.toLowerCase();
  const conf        = Math.round(l.confidence_score);
  const confColor   = conf >= 90 ? "#00d4aa" : conf >= 70 ? "#6c63ff" : conf >= 50 ? "#ffb547" : "#ff4f6b";
  const circ        = 2 * Math.PI * 28;
  const dash        = circ * (1 - conf/100);

  const badge = l.applied
    ? `<span class="status-badge badge-applied">✓ Applied</span>`
    : l.match_status === "Approved"
    ? `<span class="status-badge badge-approved">✓ Approved</span>`
    : l.match_status === "Rejected"
    ? `<span class="status-badge badge-rejected">✗ Rejected</span>`
    : `<span class="status-badge badge-pending">⏳ Pending</span>`;

  const canAct = !l.applied;

  return `
<div class="match-card ${statusClass}" id="card-${l.name}" style="animation-delay:${animIdx*30}ms">

  <div class="card-header">
    <!-- Payment side -->
    <div class="side-block">
      <div class="side-label">💳 Payment Entry</div>
      <div class="side-name">${esc(l.payment_entry)}</div>
      <div class="side-party">${esc(l.payment_party)}</div>
      <div class="side-amount payment-amount">${fmt(l.payment_amount)}</div>
      <div class="side-party" style="margin-top:2px">${l.payment_date}</div>
    </div>

    <!-- Confidence ring -->
    <div class="confidence-center">
      <div class="conf-ring">
        <svg width="68" height="68" viewBox="0 0 68 68">
          <circle class="track" cx="34" cy="34" r="28"/>
          <circle class="fill" cx="34" cy="34" r="28"
            stroke="${confColor}"
            stroke-dasharray="${circ}"
            stroke-dashoffset="${dash}"/>
        </svg>
        <div class="conf-number" style="color:${confColor}">${conf}%</div>
      </div>
      <div class="conf-label">confidence</div>
    </div>

    <div class="arrow-connector">→</div>

    <!-- Invoice side -->
    <div class="side-block">
      <div class="side-label">📄 ${esc(l.invoice_type)}</div>
      <div class="side-name">${esc(l.invoice)}</div>
      <div class="side-party">${l.invoice_date}${l.outstanding_amount !== l.invoice_amount ? ` · Outst: ${fmt(l.outstanding_amount)}` : ""}</div>
      <div class="side-amount invoice-amount">${fmt(l.invoice_amount)}</div>
    </div>
  </div>

  <!-- AI reasoning -->
  ${l.ai_reasoning ? `
  <div class="reasoning-strip">
    <div class="ai-icon">🤖</div>
    <div class="reasoning-text">${esc(l.ai_reasoning)}</div>
  </div>` : ""}

  <!-- Footer actions -->
  <div class="card-footer">
    <div class="footer-left">
      ${badge}
      <div class="amount-edit">
        <span>Allocate:</span>
        <input class="amount-input" type="number" id="alloc-${l.name}"
          value="${l.allocated_amount.toFixed(2)}"
          ${!canAct ? "disabled" : ""}
          onchange="updateAlloc('${l.name}', this.value)">
      </div>
    </div>
    <div class="footer-right">
      ${canAct && l.match_status !== "Rejected" ? `
        <button class="btn btn-danger" style="padding:6px 14px;font-size:12px"
          onclick="setStatus('${l.name}','Rejected')">✗ Reject</button>` : ""}
      ${canAct && l.match_status !== "Approved" ? `
        <button class="btn btn-success" style="padding:6px 14px;font-size:12px"
          onclick="setStatus('${l.name}','Approved')">✓ Approve</button>` : ""}
      ${canAct && l.match_status === "Approved" ? `
        <button class="btn btn-primary" style="padding:6px 14px;font-size:12px"
          onclick="applyOne('${l.name}')">⚡ Apply Now</button>` : ""}
    </div>
  </div>

</div>`;
}

function renderEmpty(msg) {
  document.getElementById("matches-list").innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">⚠️</div>
      <div class="empty-title">${esc(msg)}</div>
    </div>`;
}

// ── Actions ───────────────────────────────────────────────────────────────────
async function setStatus(lineName, status) {
  const line = allLines.find(l => l.name === lineName);
  if (!line) return;
  const alloc = parseFloat(document.getElementById(`alloc-${lineName}`)?.value || line.allocated_amount);
  try {
    await apiFetch(`${API}.update_line_status`, {
      line_name: lineName, status, allocated_amount: alloc
    });
    line.match_status    = status;
    line.allocated_amount = alloc;
    toast(status === "Approved" ? "✓ Approved" : "✗ Rejected",
          status === "Approved" ? "success" : "error");
    updateStats();
    renderCards();
  } catch(e) { toast(`Error: ${e.message}`, "error"); }
}

async function updateAlloc(lineName, val) {
  const line = allLines.find(l => l.name === lineName);
  if (!line) return;
  const amount = parseFloat(val) || 0;
  try {
    await apiFetch(`${API}.update_line_status`, {
      line_name: lineName, status: line.match_status, allocated_amount: amount
    });
    line.allocated_amount = amount;
  } catch(e) { toast(`Error: ${e.message}`, "error"); }
}

async function applyOne(lineName) {
  const line = allLines.find(l => l.name === lineName);
  if (!line || line.applied) return;
  showSpinner("Applying reconciliation...");
  try {
    const res = await apiFetch(`${API}.apply_single_line`, { line_name: lineName });
    line.applied = true;
    toast(`✓ Applied: ${line.payment_entry} → ${line.invoice}`, "success");
    updateStats();
    renderCards();
  } catch(e) { toast(`Error: ${e.message}`, "error"); }
  finally { hideSpinner(); }
}

async function applyAllApproved() {
  const count = allLines.filter(l => l.match_status === "Approved" && !l.applied).length;
  if (!count) { toast("No approved matches to apply.", "info"); return; }
  if (!confirm(`Apply ${count} approved match(es)? This will update Payment Entries and mark invoices as paid.`)) return;

  showSpinner(`Applying ${count} reconciliation(s)...`);
  try {
    const res = await apiFetch(`${API.replace('.get_match_data','')}.apply_approved`.replace('get_match_data','').replace(/\.$/, '') + 'apply_approved',
      { doc_name: DOC_NAME });
    // Reload fresh data
    await loadData();
    const r = res.message;
    toast(`Applied: ${r.applied} | Errors: ${r.errors}`,
          r.errors > 0 ? "info" : "success");
  } catch(e) { toast(`Error: ${e.message}`, "error"); }
  finally { hideSpinner(); }
}

// ── Spinner ───────────────────────────────────────────────────────────────────
function showSpinner(msg="Processing...") {
  let el = document.getElementById("spinner-overlay");
  if (!el) {
    el = document.createElement("div");
    el.className = "spinner-overlay";
    el.id = "spinner-overlay";
    document.body.appendChild(el);
  }
  el.innerHTML = `<div class="spinner"></div><div class="spinner-text">${esc(msg)}</div>`;
  el.style.display = "flex";
}
function hideSpinner() {
  const el = document.getElementById("spinner-overlay");
  if (el) el.style.display = "none";
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg, type="info") {
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// ── API fetch (works inside Frappe or standalone) ─────────────────────────────
async function apiFetch(method, args={}) {
  // Try Frappe's frappe.call first
  if (typeof frappe !== "undefined" && frappe.call) {
    return new Promise((resolve, reject) => {
      frappe.call({ method, args,
        callback: r => { if (r.exc) reject(new Error(r.exc)); else resolve(r); },
      });
    });
  }
  // Fallback: direct HTTP call (for standalone / iframe use)
  const body = new FormData();
  Object.entries(args).forEach(([k,v]) => body.append(k, typeof v==="object" ? JSON.stringify(v) : v));
  const res = await fetch(`/api/method/${method}`, { method:"POST", body,
    headers: { "X-Frappe-CSRF-Token": getCsrf() } });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (json.exc) throw new Error(json.exc);
  return json;
}

function getCsrf() {
  return document.cookie.split(";").map(c=>c.trim())
    .find(c=>c.startsWith("csrf_token="))?.split("=")?.[1] || "";
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(n) {
  return new Intl.NumberFormat("en-US", {minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
}
function esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
